[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dtree-explorer"
dynamic = ["version"]
description = "DTree Explorer: encode a directed tree with DTree's two projections (Q1, Q2) or EulerTree's one list and watch it step by step, in the browser"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Enis Olgac", email = "enis@digraphs.info" }]
dependencies = ["triordinal-dtree>=2.3.0"]
keywords = ["directed tree", "tree topology", "reachability", "visualization", "incremental encoding", "teaching"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.scripts]
dtree-explorer = "dtree_explorer.__main__:main"

[project.urls]
Homepage = "https://github.com/EnisOlgac/DTree-Explorer"
Library = "https://github.com/EnisOlgac/DTree"
Online = "https://dtree.digraphs.net/"
Paper = "https://doi.org/10.5772/intechopen.1013408"

[tool.setuptools]
packages = ["dtree_explorer"]

[tool.setuptools.dynamic]
version = { attr = "dtree_explorer.__version__" }

[tool.setuptools.package-data]
dtree_explorer = ["explorer.html"]
