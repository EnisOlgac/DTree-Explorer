name: publish

# Runs when a GitHub release is published (gh release create vX.Y.Z ...): rebuilds the page
# with the current dtree-encoding, tests, checks that the package version matches the tag,
# attaches the page as DTree-Explorer.html to the release, and uploads the package to PyPI
# (dtree-explorer) with Trusted Publishing: no passwords or API keys are stored.

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # PyPI Trusted Publishing
      contents: write          # attach the page to the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade build "dtree-encoding>=1.8.0"
      - name: Build the page
        run: python src/build.py
      - name: Test
        run: python -m unittest discover -s tests
      - name: Check version
        run: |
          v=$(python -c "import dtree_explorer; print(dtree_explorer.__version__)")
          test "v$v" = "${{ github.event.release.tag_name }}" || { echo "package version $v does not match tag ${{ github.event.release.tag_name }}"; exit 1; }
      - name: Attach the page to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dtree_explorer/explorer.html DTree-Explorer.html
          gh release upload "${{ github.event.release.tag_name }}" DTree-Explorer.html --clobber
      - name: Build the package
        run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
